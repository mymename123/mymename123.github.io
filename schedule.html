<script>
// 체험단 일정 관리: 신청 → 선정 → 방문 예정 → 후기 작성 → 완료
// 저장: 방문자 브라우저의 localStorage (서버로 보내지 않음). 기기를 바꿀 땐 백업 내보내기/불러오기
const STATUSES = ["신청", "선정", "방문 예정", "후기 작성", "완료", "미선정"];
const HOT_DAYS = 3; // 마감 3일 이내면 빨간색
const $ = (id) => document.getElementById(id);
let items = [];
let filter = "진행 중";
let calBase = new Date();
calBase.setDate(1);

const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const todayIso = () => iso(new Date());
function daysLeft(s) {
  if (!s) return null;
  const a = new Date(todayIso() + "T00:00:00"), b = new Date(s + "T00:00:00");
  return Math.round((b - a) / 86400000);
}
const closed = (it) => it.status === "완료" || it.status === "미선정";

// 상태에 따라 지금 챙겨야 할 날짜 하나
function nextDate(it) {
  if (closed(it)) return null;
  if (it.status === "신청") return it.announce ? { d: it.announce, k: "발표" } : null;
  if ((it.status === "선정" || it.status === "방문 예정") && it.visit && daysLeft(it.visit) >= 0) return { d: it.visit, k: "방문" };
  return it.reviewEnd ? { d: it.reviewEnd, k: "마감" } : null;
}
function isHot(it) {
  const n = nextDate(it);
  if (!n || n.k === "발표") return false;
  const l = daysLeft(n.d);
  return l !== null && l <= HOT_DAYS;
}
function ddText(it) {
  const n = nextDate(it);
  if (!n) return closed(it) ? it.status : "날짜 없음";
  const l = daysLeft(n.d);
  if (l < 0) return n.k + " " + -l + "일 지남";
  if (l === 0) return "오늘 " + n.k;
  return n.k + " D-" + l;
}

const KEY = "chmoa-schedule-v1";
function load() {
  try { items = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { items = []; }
  if (!Array.isArray(items)) items = [];
  render();
}
let warned = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(items)); }
  catch (e) { if (!warned) { warned = true; alert("이 브라우저에서는 저장이 안 돼요(시크릿 모드 등). 백업 내보내기로 따로 보관해 주세요."); } }
  render();
}
// 다른 탭에서 바꾸면 이 탭도 맞춤
window.addEventListener("storage", (e) => { if (e.key === KEY) load(); });

function renderFilters() {
  const f = $("filters");
  f.innerHTML = "";
  ["진행 중", "전체"].concat(STATUSES).forEach((s) => {
    const b = document.createElement("button");
    const n = s === "전체" ? items.length : s === "진행 중" ? items.filter((x) => !closed(x)).length : items.filter((x) => x.status === s).length;
    b.textContent = s + " " + n;
    b.className = s === filter ? "on" : "";
    b.onclick = () => { filter = s; render(); };
    f.appendChild(b);
  });
}

function sortKey(it) {
  const n = nextDate(it);
  if (closed(it)) return "9" + (it.reviewEnd || "");
  return n ? "1" + n.d : "5";
}

function renderList() {
  const box = $("list");
  box.innerHTML = "";
  const shown = items
    .filter((x) => filter === "전체" || (filter === "진행 중" ? !closed(x) : x.status === filter))
    .sort((a, b) => sortKey(a).localeCompare(sortKey(b)));
  if (!shown.length) {
    box.innerHTML = '<div class="empty">아직 일정이 없어요.<br>위 "➕ 일정 추가"를 눌러 신청한 캠페인을 넣어 보세요.</div>';
    return;
  }
  shown.forEach((it) => {
    const c = document.createElement("div");
    c.className = "card" + (isHot(it) ? " hot" : "") + (closed(it) ? " done" : "");
    c.id = "c_" + it.id;
    const l = nextDate(it) ? daysLeft(nextDate(it).d) : null;
    c.innerHTML = `
      <div class="top">
        <a class="ttl" target="_blank"></a>
        <span class="dd ${isHot(it) ? (l < 0 ? "over" : "hot") : ""}"></span>
      </div>
      <div class="site"></div>
      <div class="row">
        <label>상태<select data-k="status">${STATUSES.map((s) => `<option${s === it.status ? " selected" : ""}>${s}</option>`).join("")}</select></label>
        <label>발표일<input type="date" data-k="announce"></label>
        <label>방문일<input type="date" data-k="visit"></label>
        <label>리뷰 마감일<input type="date" data-k="reviewEnd"></label>
      </div>
      <textarea data-k="memo" placeholder="메모 (예약 시간, 미션 등)"></textarea>
      <div class="acts"><button data-act="del">삭제</button></div>`;
    const a = c.querySelector(".ttl");
    a.textContent = it.title || "(이름 없음)";
    if (it.url) a.href = it.url; else a.removeAttribute("href");
    c.querySelector(".dd").textContent = ddText(it);
    c.querySelector(".site").textContent = [it.site, it.applyEnd ? "신청 마감 " + it.applyEnd : "", it.period ? "리뷰 기간 " + it.period : ""].filter(Boolean).join(" · ");
    c.querySelectorAll("[data-k]").forEach((el) => {
      const k = el.dataset.k;
      if (k !== "status") el.value = it[k] || "";
      el.addEventListener("change", () => { it[k] = el.value; save(); });
    });
    c.querySelector('[data-act="del"]').onclick = () => {
      if (!confirm("'" + (it.title || "이 일정") + "'을 지울까요?")) return;
      items = items.filter((x) => x.id !== it.id);
      save();
    };
    box.appendChild(c);
  });
}

function renderCal() {
  const y = calBase.getFullYear(), m = calBase.getMonth();
  $("calTitle").textContent = y + "년 " + (m + 1) + "월";
  const cal = $("cal");
  cal.innerHTML = "";
  "일월화수목금토".split("").forEach((w) => {
    const d = document.createElement("div");
    d.className = "wd";
    d.textContent = w;
    cal.appendChild(d);
  });
  const ev = {};
  const push = (date, cls, label, it) => { if (date) (ev[date] = ev[date] || []).push({ cls, label, it }); };
  items.filter((x) => x.status !== "미선정").forEach((it) => {
    if (it.status === "신청") push(it.announce, "ann", "📢 " + it.title, it);
    push(it.visit, "visit", "📍 " + it.title, it);
    push(it.reviewEnd, it.status === "완료" ? "" : "due", "⏰ " + it.title, it);
  });
  const start = new Date(y, m, 1 - new Date(y, m, 1).getDay());
  const t = todayIso();
  for (let i = 0; i < 42; i++) {
    const day = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    if (i >= 35 && day.getMonth() !== m) break;
    const k = iso(day);
    const d = document.createElement("div");
    d.className = "d" + (day.getMonth() !== m ? " out" : "") + (k === t ? " today" : "");
    d.innerHTML = `<div class="n">${day.getDate()}</div>`;
    (ev[k] || []).forEach((e) => {
      const s = document.createElement("span");
      s.className = "ev " + e.cls;
      s.textContent = e.label;
      s.title = e.label;
      s.onclick = () => {
        if (filter !== "전체" && !(filter === "진행 중" && !closed(e.it)) && filter !== e.it.status) { filter = "전체"; render(); }
        const card = $("c_" + e.it.id);
        if (card) { card.scrollIntoView({ behavior: "smooth", block: "center" }); card.animate([{ background: "#fff7cc" }, { background: "#fff" }], 1500); }
      };
      d.appendChild(s);
    });
    cal.appendChild(d);
  }
}

function render() {
  const open = items.filter((x) => !closed(x));
  const hot = open.filter(isHot);
  $("summary").textContent = `진행 중 ${open.length}건 · 마감·방문 ${HOT_DAYS}일 이내 ${hot.length}건` + (hot.length ? " (빨간 칸부터 챙기세요)" : "");
  renderFilters();
  renderList();
  renderCal();
}

$("prevM").onclick = () => { calBase.setMonth(calBase.getMonth() - 1); renderCal(); };
$("nextM").onclick = () => { calBase.setMonth(calBase.getMonth() + 1); renderCal(); };
$("todayM").onclick = () => { calBase = new Date(); calBase.setDate(1); renderCal(); };
$("aStatus").innerHTML = STATUSES.map((s) => `<option>${s}</option>`).join("");
$("addToggle").onclick = () => { $("addBox").classList.toggle("show"); if ($("addBox").classList.contains("show")) $("aTitle").focus(); };
document.getElementById("year").textContent = new Date().getFullYear();
$("aSave").onclick = () => {
  const title = $("aTitle").value.trim();
  if (!title) { $("aTitle").focus(); return; }
  items.unshift({
    id: "s" + Date.now(), t: Date.now(), title, site: $("aSite").value.trim(), url: $("aUrl").value.trim(),
    status: $("aStatus").value, announce: $("aAnn").value, visit: $("aVisit").value, reviewEnd: $("aDue").value, memo: ""
  });
  ["aTitle", "aSite", "aUrl", "aAnn", "aVisit", "aDue"].forEach((k) => ($(k).value = ""));
  $("addBox").classList.remove("show");
  save();
};
$("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(items, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "체험단일정_" + todayIso() + ".json";
  a.click();
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data)) throw new Error("형식이 달라요");
    const have = new Set(items.map((x) => x.id));
    const add = data.filter((x) => x && x.id && !have.has(x.id));
    items = items.concat(add);
    save();
    alert(add.length + "건을 불러왔어요. (이미 있는 일정은 건너뜀)");
  } catch (err) {
    alert("백업 파일을 못 읽었어요: " + err.message);
  }
  e.target.value = "";
};
load();
</script>
<script>
  (function () {
    var slots = document.querySelectorAll("ins.adsbygoogle");
    if (!slots.length) return;
    if (slots[0].getAttribute("data-ad-client").indexOf("0000000000000000") !== -1) {
      document.querySelectorAll(".ad").forEach(function (d) { d.remove(); });
      return;
    }
    slots.forEach(function () { (window.adsbygoogle = window.adsbygoogle || []).push({}); });
  })();
</script>
</body>
