<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">

<link rel="icon" href="favicon.svg" type="image/svg+xml">

<title>로그인 | 블로랩</title>
<!-- 로그인 페이지에는 광고·방문자 통계를 넣지 않아요 (로그인 정보가 다른 곳으로 가지 않게) -->
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.7; word-break: keep-all; }
  .lg-main { padding-block: 48px 72px; }
  .lg-card { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .lg-head { display: flex; flex-direction: column; gap: 8px; }
  .lg-btns { display: flex; flex-direction: column; gap: 10px; }
  .lg-btn { position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 50px; padding: 0 48px; border-radius: 12px; border: 1px solid transparent; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; }
  .lg-btn svg { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; }
  .lg-btn:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
  .lg-btn:disabled { opacity: .6; cursor: default; }
  .lg-kakao { background: #fee500; color: rgba(0, 0, 0, .85); }
  .lg-kakao:hover { background: #f5dc00; }
  .lg-naver { background: #03c75a; color: #fff; }
  .lg-naver:hover { background: #02b351; }
  .lg-naver svg { width: 16px; height: 16px; left: 20px; }
  .lg-google { background: #fff; color: #1f1f1f; border-color: #747775; }
  .lg-google:hover { background: #f6f8fa; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .lg-google { background: #131314; color: #e3e3e3; border-color: #8e918f; } }
  :root[data-theme="dark"] .lg-google { background: #131314; color: #e3e3e3; border-color: #8e918f; }
  .lg-note { display: flex; flex-direction: column; gap: 4px; padding-top: 16px; border-top: 1px solid var(--line); }
  .lg-note a { color: var(--green); }
  .lg-who { display: flex; align-items: center; gap: 14px; }
  .lg-av { flex: none; width: 52px; height: 52px; border-radius: 50%; background: var(--navy); color: var(--mint); font-size: 22px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .lg-who > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .lg-who b { font-size: 19px; overflow-wrap: anywhere; }
  .lg-acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .lg-after { max-width: 488px; margin: 14px auto 0; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
  .lg-after:empty { display: none; }
  .lg-quiet { background: none; border: 0; padding: 6px 4px; font: inherit; font-size: 13px; color: var(--sub); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .lg-quiet:hover { color: var(--text); }
  .lg-quiet:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; border-radius: 4px; }
  #byeBox { align-self: stretch; }
  #byeBox:empty { display: none; }
  .lg-confirm { display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  .lg-confirm p { margin: 0; }
  .lg-confirm ul { margin: 0; padding-left: 20px; color: var(--sub); font-size: 14px; }
  .lg-wait { display: flex; align-items: center; gap: 10px; color: var(--sub); }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="site.css">
</head>
<body>
<header class="sh"><div class="sh-in">
  <a class="sh-logo" href="index.html"><svg width="21" height="28" viewBox="16.5 10 31 44" aria-hidden="true"><circle cx="32" cy="38.5" r="10" fill="none" stroke="#2bd48a" stroke-width="7"/><rect x="18.5" y="12" width="7" height="40" rx="3.5" fill="#fff"/><circle cx="32" cy="38.5" r="3" fill="#fff"/></svg>블로랩</a>
  <nav class="sh-nav" aria-label="주요 메뉴"><a href="history.html">블로그 히스토리</a><a href="widget.html">업적 위젯</a><a href="analyze.html">체험단 진단</a><a href="analyze.html?mode=adpost">애드포스트 진단</a><a href="schedule.html">일정 관리</a><a href="index.html#sites">사이트 모음</a><a href="index.html#tips">꿀팁</a><a href="about.html">소개</a></nav>
  <div class="menu"><button class="mbtn" id="mbtn" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="mnav"><span></span><span></span><span></span></button>
  <nav class="mnav" id="mnav" hidden><a href="history.html">내 블로그 히스토리</a><a href="widget.html">블로그 업적 위젯</a><a href="analyze.html">체험단 탈락원인 진단</a><a href="analyze.html?mode=adpost">애드포스트 탈락원인 진단</a><a href="schedule.html">일정 관리</a><a href="index.html#sites">체험단 사이트 모음</a><a href="index.html#tips">꿀팁</a><a href="about.html">소개·문의</a></nav></div>
</div></header>

<main class="cm-wrap lg-main">
  <div class="cm-card lg-card" id="box" aria-live="polite">
    <div class="lg-wait"><span class="cm-spin" aria-hidden="true"></span>잠시만요…</div>
  </div>
  <div class="lg-after" id="after"></div>
</main>

<script src="auth.js"></script>
<script>
  // 로그인 화면: 고르기 → (카카오·네이버·구글) → 돌아와서 #c=1회용 코드로 로그인 마무리 → 내 정보
  (function () {
    var A = window.BLAuth, box = document.getElementById("box"), after = document.getElementById("after");
    var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
    var ERR = {
      cancel: "로그인을 취소했어요.",
      state: "로그인 시간이 지났거나 다른 창에서 시작했어요. 이 창에서 다시 눌러 주세요.",
      provider: "로그인한 곳에서 회원 정보를 받지 못했어요. 잠시 뒤 다시 해 주세요.",
      nokey: "이 로그인은 아직 준비 중이에요.",
      nodb: "로그인은 아직 준비 중이에요.",
      rejoin: "탈퇴한 계정은 30일 동안 다시 가입할 수 없어요.",
      server: "잠시 문제가 생겼어요. 잠시 뒤 다시 해 주세요."
    };
    var ICON = {
      kakao: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#000" d="M12 3C6.48 3 2 6.58 2 11c0 2.84 1.86 5.33 4.66 6.75l-.95 3.48c-.08.3.26.55.53.37l4.15-2.77c.53.06 1.07.09 1.61.09 5.52 0 10-3.58 10-8S17.52 3 12 3z"/></svg>',
      naver: '<svg viewBox="0 0 20 20" aria-hidden="true"><path fill="#fff" d="M13.56 10.7 6.17 0H0v20h6.44V9.3L13.83 20H20V0h-6.44z"/></svg>',
      google: '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>'
    };
    var qs = new URLSearchParams(location.search);
    if (qs.get("preview") === "1") A.preview(true);   // 공개 전 시험용: 이 브라우저에만 로그인 버튼 보이기
    if (qs.get("preview") === "0") A.preview(false);
    var ret = A.safeRet(qs.get("r") || "");
    var hash = new URLSearchParams(location.hash.slice(1));
    if (location.hash) history.replaceState(null, "", "login.html" + (ret !== "/" ? "?r=" + encodeURIComponent(ret) : ""));

    // "2026-12-10" → "2026년 12월 10일"
    function day(d) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ""); return m ? m[1] + "년 " + (+m[2]) + "월 " + (+m[3]) + "일" : ""; }
    function choose(err) {
      after.innerHTML = "";
      if (!A.on() && !err) {
        box.innerHTML = '<div class="lg-head"><span class="cm-kicker">블로랩 회원</span><h1 class="cm-h2">로그인은 곧 열려요</h1>' +
          '<p class="cm-lead">지금은 로그인 없이 모든 기능을 쓸 수 있어요.</p></div><a class="cm-btn" href="index.html">첫 화면으로</a>';
        return;
      }
      box.innerHTML = '<div class="lg-head"><span class="cm-kicker">블로랩 회원</span><h1 class="cm-h2">간편하게 시작하기</h1>' +
        '<p class="cm-cap">쓰던 계정으로 바로 시작해요. 처음이면 자동으로 회원이 돼요.</p></div>' +
        (err ? '<p class="cm-msg err" role="alert">' + esc(err) + "</p>" : "") +
        '<div class="lg-btns">' +
        '<button class="lg-btn lg-kakao" type="button" data-p="kakao">' + ICON.kakao + "카카오로 시작하기</button>" +
        '<button class="lg-btn lg-naver" type="button" data-p="naver">' + ICON.naver + "네이버로 시작하기</button>" +
        '<button class="lg-btn lg-google" type="button" data-p="google">' + ICON.google + "Google로 계속하기</button>" +
        "</div>" +
        '<div class="lg-note"><p class="cm-cap">받는 정보는 <b>회원 번호와 닉네임</b>뿐이에요. 이메일, 전화번호, 프로필 사진은 받지 않아요.</p>' +
        '<p class="cm-cap"><a href="privacy.html">개인정보처리방침</a></p></div>';
      box.querySelectorAll("[data-p]").forEach(function (b) {
        b.addEventListener("click", function () {
          box.querySelectorAll("[data-p]").forEach(function (x) { x.disabled = true; });
          b.innerHTML = b.innerHTML.replace(/(시작하기|계속하기)$/, "여는 중…");
          A.login(b.getAttribute("data-p"), ret === "/" ? "/login.html" : ret);
        });
      });
    }

    function account(u) {
      var since = u.since ? new Date(u.since) : null;
      box.innerHTML = '<div class="lg-who"><span class="lg-av" aria-hidden="true">' + esc(Array.from(u.nick || "블")[0]) + "</span><div>" +
        "<b>" + esc(u.nick) + "님</b>" +
        '<span class="cm-cap"><span class="cm-pill">' + (u.plan === "pro" ? "PRO" : "FREE") + "</span>" +
        (since ? " · " + since.getFullYear() + "년 " + (since.getMonth() + 1) + "월 " + since.getDate() + "일 가입" : "") + "</span></div></div>" +
        '<p class="cm-cap">이 기기에서 로그인돼 있어요. 다른 기기에서는 따로 로그인해 주세요.</p>' +
        '<div class="lg-acts">' + (ret !== "/" ? '<a class="cm-btn pri" href="' + esc(ret.slice(1) || "index.html") + '">보던 페이지로</a><a class="cm-btn" href="me.html">내 블로그</a>' : '<a class="cm-btn pri" href="me.html">내 블로그</a><a class="cm-btn" href="index.html">첫 화면으로</a>') +
        '<button class="cm-btn" type="button" id="out">로그아웃</button></div>';
      // 탈퇴는 카드 밖 아래에 작은 글씨로 (동혁 결정: 눈에 덜 띄게, 빨간색 말고 검은색)
      after.innerHTML = '<button class="lg-quiet" type="button" id="bye" aria-expanded="false" aria-controls="byeBox">회원 탈퇴</button><div id="byeBox"></div>';
      document.getElementById("out").addEventListener("click", function () {
        this.disabled = true;
        A.logout().then(function () { choose(); notice("로그아웃했어요."); });
      });
      document.getElementById("bye").addEventListener("click", function () {
        var b = document.getElementById("byeBox"), t = this;
        if (b.innerHTML) { b.innerHTML = ""; t.setAttribute("aria-expanded", "false"); return; }
        t.setAttribute("aria-expanded", "true");
        b.innerHTML = '<div class="lg-confirm"><p><b>정말 탈퇴할까요?</b></p><ul><li>회원 번호와 닉네임이 바로 지워지고, 되돌릴 수 없어요.</li><li>같은 계정으로는 30일 동안 다시 가입할 수 없어요.</li></ul>' +
          '<div class="lg-acts"><button class="cm-btn" type="button" id="byeYes">탈퇴하기</button><button class="cm-btn ghost" type="button" id="byeNo">취소</button></div><p id="byeMsg" class="cm-cap" role="alert"></p></div>';
        document.getElementById("byeNo").addEventListener("click", function () { b.innerHTML = ""; t.setAttribute("aria-expanded", "false"); t.focus(); });
        document.getElementById("byeYes").addEventListener("click", function () {
          var y = this; y.disabled = true; y.textContent = "탈퇴하는 중…";
          A.withdraw().then(function (j) {
            if (j && j.ok) { choose(); notice("탈퇴했어요. 그동안 고마웠어요." + (j.rejoin ? " 같은 계정으로는 " + day(j.rejoin) + "부터 다시 가입할 수 있어요." : "")); return; }
            y.disabled = false; y.textContent = "탈퇴하기";
            document.getElementById("byeMsg").textContent = (j && j.error) || "탈퇴하지 못했어요. 잠시 뒤 다시 해 주세요.";
          });
        });
      });
    }
    function notice(t) {
      var p = document.createElement("p");
      p.className = "cm-msg"; p.setAttribute("role", "status"); p.textContent = t;
      box.insertBefore(p, box.children[1] || null);
    }
    function wait(t) { after.innerHTML = ""; box.innerHTML = '<div class="lg-wait"><span class="cm-spin" aria-hidden="true"></span>' + esc(t) + "</div>"; }

    var code = hash.get("c"), err = hash.get("e");
    if (code) {
      wait("로그인하는 중이에요…");
      fetch(A.api + "/auth/exchange", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: code }) })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j || !j.ok) { choose(j && j.error || ERR.server); return; }
          A.save(j.token, j.user);
          var back = A.safeRet(j.ret);
          if (back !== "/" && back !== "/login.html") { location.replace(back.slice(1) || "index.html"); return; }
          account(j.user);
          notice(j.user.nick + "님, 반가워요!");
        })
        .catch(function () { choose("인터넷 연결을 확인하고 다시 해 주세요."); });
    } else if (err) {
      choose((ERR[err] || ERR.server) + (err === "rejoin" && day(hash.get("u")) ? " " + day(hash.get("u")) + "부터 다시 가입할 수 있어요." : ""));
    } else if (A.token()) {
      A.me(true).then(function (j) {
        if (j && j.login) account(j.user);
        else if (j && j.offline) choose("서버에 연결하지 못했어요. 잠시 뒤 다시 해 주세요.");
        else choose();
      });
    } else {
      choose();
    }
  })();

  // ☰ 메뉴 열고 닫기 (바깥 누르기·Esc·메뉴 고르기로 닫힘)
  (function () {
    var b = document.getElementById("mbtn"), n = document.getElementById("mnav");
    if (!b || !n) return;
    function set(open) { n.hidden = !open; b.setAttribute("aria-expanded", open ? "true" : "false"); b.setAttribute("aria-label", open ? "메뉴 닫기" : "메뉴 열기"); }
    b.addEventListener("click", function (e) { e.stopPropagation(); set(n.hidden); });
    n.addEventListener("click", function () { set(false); });
    document.addEventListener("click", function (e) { if (!n.hidden && !n.contains(e.target)) set(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !n.hidden) { set(false); b.focus(); } });
  })();
</script>
</body>
</html>
