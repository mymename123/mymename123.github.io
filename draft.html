<!-- 회원 페이지에는 광고·방문자 통계를 넣지 않아요 -->
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.7; word-break: keep-all; }
  .pd-main { padding-block: 28px 96px; display: flex; flex-direction: column; gap: 16px; max-width: 720px; margin: 0 auto; }
  .pd-head { display: flex; flex-direction: column; gap: 6px; }
  .pd-card { display: flex; flex-direction: column; gap: 14px; }
  .pd-card > h2 { margin: 0; }
  .pd-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .pd-row > * { flex: 1 1 150px; min-width: 0; }
  .pd-acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .pd-acts .grow { flex: 1 1 auto; }
  select.cm-input { appearance: auto; }
  textarea.cm-input { padding: 12px 14px; line-height: 1.7; min-height: 96px; resize: vertical; }
  textarea.pd-body { min-height: 420px; font-size: 15px; }
  .pd-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .pd-ph { position: relative; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; min-width: 0; }
  .pd-ph img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .pd-ph .no { position: absolute; left: 6px; top: 6px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; background: rgba(14, 26, 43, .82); color: #fff; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
  .pd-ph .bar { display: flex; }
  .pd-ph .bar button { flex: 1; min-height: 36px; border: 0; border-top: 1px solid var(--line); border-right: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 14px; cursor: pointer; }
  .pd-ph .bar button:last-child { border-right: 0; color: #b42318; }
  .pd-ph .bar button:disabled { opacity: .35; }
  .pd-ph input { border: 0; border-top: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 14px; padding: 8px; min-width: 0; width: 100%; box-sizing: border-box; }
  .pd-pick { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 120px; border: 2px dashed var(--line); border-radius: 12px; color: var(--sub); cursor: pointer; text-align: center; padding: 16px; }
  .pd-pick b { color: var(--green); font-size: 16px; }
  .pd-pick:focus-within { outline: 3px solid var(--green); outline-offset: 2px; }
  .pd-pick input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .pd-chk { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
  .pd-chk input { width: 20px; height: 20px; margin-top: 3px; flex: none; accent-color: var(--green); }
  details.pd-more { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  details.pd-more summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  details.pd-more[open] summary { margin-bottom: 10px; }
  details.pd-more > div { display: flex; flex-direction: column; gap: 10px; }
  .pd-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .pd-list li { border-bottom: 1px solid var(--line); }
  .pd-list li:last-child { border-bottom: 0; }
  .pd-list button { width: 100%; text-align: left; background: none; border: 0; padding: 12px 0; font: inherit; color: var(--text); cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
  .pd-list b { font-size: 16px; overflow-wrap: anywhere; }
  .pd-list span { font-size: 13px; color: var(--sub); }
  .pd-list button:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; border-radius: 6px; }
  .pd-titles { display: flex; flex-direction: column; gap: 6px; }
  .pd-titles button { text-align: left; white-space: normal; min-height: 44px; padding: 8px 14px; font-weight: 500; }
  .pd-titles button[aria-pressed="true"] { border-color: var(--green); background: var(--chip); font-weight: 700; }
  .pd-key { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .pd-key code { flex: 1 1 200px; font: 600 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 10px 12px; border-radius: 10px; background: var(--chip); color: var(--green); overflow-wrap: anywhere; }
  .pd-wait { display: flex; align-items: center; gap: 10px; color: var(--sub); }
  .pd-steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--sub); }
  .pd-re { position: relative; }
  .pd-re input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .pd-re:focus-within { outline: 3px solid var(--green); outline-offset: 2px; }
  .pd-qa { display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--chip); }
  .pd-qa > div { display: flex; flex-direction: column; gap: 10px; }
  .pd-qa p { margin: 0; }
  .pd-quiet { background: none; border: 0; padding: 6px 4px; font: inherit; font-size: 13px; color: var(--sub); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .pd-quiet:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; border-radius: 4px; }
  .th-stage { background: #2b2d31; border-radius: 12px; padding: 8px; display: flex; justify-content: center; }
  .th-stage canvas { display: block; width: 100%; max-width: 460px; height: auto; aspect-ratio: 1; touch-action: none; border-radius: 6px; -webkit-user-select: none; user-select: none; }
  .th-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
  .th-ph { position: relative; flex: none; width: 84px; height: 84px; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); color: var(--sub); font: inherit; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; }
  .th-ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .th-ph i { position: absolute; left: 4px; top: 4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: rgba(14, 26, 43, .82); color: #fff; font-size: 12px; font-style: normal; font-weight: 700; line-height: 20px; }
  .th-ph.more { border-style: dashed; padding: 6px; }
  .th-ph input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .th-ph:focus-visible, .th-ph:focus-within { outline: 3px solid var(--green); outline-offset: 2px; }
  .th-r { display: flex; align-items: center; gap: 12px; font-size: 14px; min-height: 44px; }
  .th-r span { flex: none; width: 84px; color: var(--sub); }
  .th-r input { flex: 1; min-width: 0; accent-color: var(--green); }
  .th-sel { display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--chip); }
  .th-sel[hidden], #th-tx[hidden] { display: none; }
  #th-tx { display: flex; flex-direction: column; gap: 12px; }
  .th-fonts { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; -webkit-overflow-scrolling: touch; }
  .th-font { flex: none; min-height: 48px; padding: 0 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); font-size: 22px; cursor: pointer; white-space: nowrap; }
  .th-font.on { border-color: var(--green); box-shadow: 0 0 0 2px var(--green); }
  .th-font:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
  .th-sws { display: flex; flex-wrap: wrap; gap: 10px; }
  .th-sw { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--line); padding: 0; cursor: pointer; }
  .th-sw.on { box-shadow: 0 0 0 3px var(--green); border-color: var(--card); }
  img.th-now { width: 100%; max-width: 280px; aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--line); display: block; }
  @media (min-width: 620px) { .pd-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
</style>

<main class="cm-wrap pd-main" id="main">
  <div class="pd-head"><span class="cm-kicker">블로랩 회원 · 시험 중</span><h1 class="cm-h2">사진 초안</h1></div>
  <div class="cm-card"><div class="pd-wait"><span class="cm-spin" aria-hidden="true"></span>잠시만요…</div></div>
</main>
<script src="auth.js"></script>
<script>
  // 사진 초안: 폰에서 사진을 고르면 AI가 본문 초안을 써서 보관함에 둠 → PC 확장 프로그램이 불러와 네이버 글쓰기 화면에 넣음
  // 사진은 이 기기에서 줄여서 보냄 (AI가 볼 작은 사진 + PC에서 쓸 큰 사진). 서버 보관은 7일
  (function () {
    var A = window.BLAuth, main = document.getElementById("main");
    var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
    var $ = function (id) { return document.getElementById(id); };
    var HEAD = '<div class="pd-head"><span class="cm-kicker">블로랩 회원 · 시험 중</span><h1 class="cm-h2">사진 초안</h1><p class="cm-cap">폰에서 사진을 고르면 AI가 본문 초안을 써 둬요. PC에서 확장 프로그램으로 불러와 네이버 글쓰기 화면에 넣어요.</p></div>';
    var L = null;          // 서버 목록 (/draft/list)
    var items = [];        // 새 초안에 고른 사진 { b64(큰 사진), url(작은 미리 보기), day, memo }: 고르자마자 한 번만 읽어 줄여 둠 (폰이 나중에 사진 파일을 못 읽게 하는 일이 있어서)
    var prepping = false;
    var form = load("bl-pd-form", { kind: 0, tone: "pro", len: "normal" });
    var cur = null;        // 지금 보는 초안
    var curFiles = null;   // 방금 만든 초안의 사진 { id, b64s, prev, meta } (다시 쓰기·다시 올리기·썸네일용, 페이지를 떠나면 사라짐)
    var busyNow = false;
    var BIG = 1600, MAXB64 = 1850000;

    function load(k, d) { try { return Object.assign(d, JSON.parse(localStorage.getItem(k) || "{}")); } catch (e) { return d; } }
    function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    function msg(el, text, err) { if (el) el.innerHTML = text ? '<p class="cm-msg' + (err ? " err" : "") + '" role="' + (err ? "alert" : "status") + '">' + esc(text) + "</p>" : ""; }
    function when(ms) { var d = new Date(ms); return (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
    function left(ms) { var h = Math.round((ms - Date.now()) / 3600000); return h <= 0 ? "곧 지워져요" : h < 24 ? h + "시간 뒤 지워져요" : Math.round(h / 24) + "일 뒤 지워져요"; }
    function api(path, body, text) {
      var opt = body ? { method: "POST", body: JSON.stringify(body) } : text != null ? { method: "POST", body: text, headers: { "Content-Type": "text/plain" } } : {};
      return A.fetch(path, opt).then(function (r) { return r.json(); }).catch(function () { return { ok: false, offline: true, error: "인터넷 연결을 확인하고 다시 해 주세요." }; });
    }
    function gate(title, text, btn) { main.innerHTML = HEAD + '<div class="cm-card pd-card"><h2 class="cm-h3">' + esc(title) + '</h2><p class="cm-cap">' + text + "</p>" + (btn || "") + "</div>"; }
    function top() { window.scrollTo(0, 0); }

    // ---------- 첫 화면 ----------
    function home() {
      cur = null;
      if (!A.on()) { gate("곧 열려요", "회원 기능은 준비 중이에요.", '<div><a class="cm-btn" href="index.html">첫 화면으로</a></div>'); return; }
      if (!A.token()) { gate("로그인이 필요해요", "사진 초안은 로그인한 회원만 쓸 수 있어요. 초안과 사진은 내 계정에만 보관돼요.", '<div><a class="cm-btn pri" href="login.html?r=' + encodeURIComponent("/draft.html") + '">로그인하기</a></div>'); return; }
      api("/draft/list").then(function (j) {
        if (j && j.status === "need_login") { A.clear(); home(); return; }
        if (!j || !j.ok) { gate("불러오지 못했어요", esc((j && j.error) || "잠시 뒤 다시 해 주세요."), '<div><button class="cm-btn" type="button" onclick="location.reload()">다시 불러오기</button></div>'); return; }
        L = j; drawHome();
      });
    }
    function drawHome() {
      var lim = L.limit, rest = Math.max(0, lim.daily - lim.used);
      var list = L.drafts.map(function (d) {
        var st = d.status === "done" ? (d.pc ? "PC로 가져감" : "PC에서 불러올 수 있어요") : d.status === "writing" ? "AI가 쓰는 중…" : d.status === "failed" ? "실패 · 다시 만들어 주세요" : "아직 글이 없어요";
        return '<li><button type="button" data-open="' + esc(d.id) + '"><b>' + esc(d.title || d.shop || "제목 없는 초안") + "</b><span>" + when(d.created) + " · 사진 " + d.photos + "장" + (d.thumb ? " · 🖼 썸네일" : "") + " · " + st + " · " + left(d.expires) + "</span></button></li>";
      }).join("");
      main.innerHTML = HEAD +
        '<div class="cm-card pd-card"><h2 class="cm-h3">새 초안 만들기</h2>' +
        '<p class="cm-cap">오늘 ' + rest + "개 더 만들 수 있어요 (하루 " + lim.daily + "개" + (L.plan === "pro" ? ", PRO" : "") + "). 사진은 한 번에 " + lim.maxPhotos + "장까지예요.</p>" +
        newForm() + "</div>" +
        '<div class="cm-card pd-card"><h2 class="cm-h3">보관함</h2>' +
        (list ? '<ul class="pd-list">' + list + "</ul>" : '<p class="cm-cap">아직 만든 초안이 없어요.</p>') +
        '<p class="cm-cap">초안과 사진은 만든 날부터 ' + lim.keepDays + "일 동안만 보관하고 자동으로 지워요.</p></div>" +
        keyCard();
      bindNew(); bindKey();
      main.querySelectorAll("[data-open]").forEach(function (b) { b.addEventListener("click", function () { openDraft(b.dataset.open); }); });
      drawGrid();
    }

    // ---------- 새 초안 ----------
    // 빠른 질문: 직접 겪은 것을 한두 마디로 답하면 AI가 그걸 살려 씀 (사진만으로는 맛·느낌을 알 수 없어서)
    var QS = {
      "0": ["누구와, 어떻게 가게 됐나요?", "뭘 주문했고 맛은 어땠나요?", "특히 좋았던 점은?", "아쉬운 점이나 알려줄 팁은?", "다시 갈 건가요? 누구에게 추천?"],
      "1": ["누구와, 왜 여기로 갔나요?", "가장 좋았던 곳·순간은?", "비용·걸린 시간은?", "아쉬운 점이나 알려줄 팁은?", "누구에게 추천하나요?"],
      "2": ["이 숙소를 고른 이유는?", "객실·청결은 어땠나요?", "특히 좋았던 점은?", "아쉬운 점은?", "다시 묵을 건가요?"],
      "3": ["왜 샀나요?", "써 보니 어땠나요?", "좋은 점은?", "아쉬운 점은?", "누구에게 추천하나요?"],
      "4": ["어디서 봤나요?", "눈에 띈 점은?", "누구에게 좋을까요?"],
      "5": ["오늘 뭘 했나요?", "기억에 남는 것은?", "느낀 점은?"],
      "-1": ["무슨 내용의 글인가요?", "꼭 넣고 싶은 말은?"]
    };
    var qaKeep = {}; // 질문 → 적던 답 (글 종류를 바꿔도 안 지워지게)
    function qaHtml() {
      return (QS[String(+form.kind)] || QS["-1"]).map(function (q, i) { return '<label class="cm-field"><span>' + esc(q) + '</span><input class="cm-input" data-q="' + esc(q) + '" maxlength="200" autocomplete="off" value="' + esc(qaKeep[q] || "") + '"' + (i === 1 ? ' placeholder="예) 순대국 특, 국물이 진하고 순대가 푸짐했음"' : "") + "></label>"; }).join("");
    }
    function qaRead() { main.querySelectorAll("[data-q]").forEach(function (x) { qaKeep[x.dataset.q] = x.value; }); }
    function qaNow() { qaRead(); return (QS[String(+form.kind)] || QS["-1"]).map(function (q) { return { q: q, a: (qaKeep[q] || "").trim() }; }).filter(function (x) { return x.a; }); }
    function newForm() {
      var kinds = L.kinds.map(function (k, i) { return '<option value="' + i + '"' + (+form.kind === i ? " selected" : "") + ">" + esc(k) + "</option>"; }).join("") + '<option value="-1"' + (+form.kind === -1 ? " selected" : "") + ">자유 형식 (틀 없이)</option>";
      var sel = function (id, map, v) { return '<select class="cm-input" id="' + id + '">' + Object.keys(map).map(function (k) { return '<option value="' + k + '"' + (v === k ? " selected" : "") + ">" + map[k] + "</option>"; }).join("") + "</select>"; };
      return '<label class="pd-pick"><input type="file" id="files" accept="image/*" multiple><b>📷 사진 고르기</b><span class="cm-cap">갤러리에서 글에 넣을 순서대로 골라 주세요. 고른 순서대로 번호가 붙어요</span></label>' +
        '<div class="pd-grid" id="grid"></div><p class="cm-cap" id="gcap" hidden></p>' +
        '<div class="pd-row"><label class="cm-field"><span>글 종류</span><select class="cm-input" id="f-kind">' + kinds + "</select></label>" +
        '<label class="cm-field"><span>말투</span>' + sel("f-tone", { pro: "담백하고 정중하게", free: "친근하고 가볍게" }, form.tone) + "</label>" +

    // 사진 1장을 읽어 큰 사진(PC용)과 작은 미리 보기로 줄임. 못 읽으면 한 번 더 해 봄

    }
    async function addFiles(list) {

    function fileDay(f) {

    function bitmap(file) {

    function shrink(bmp, maxSide, q) {

      var side = BIG, q = 0.84, b = shrink(bmp, side, q);

    // ---------- 만들기 ----------
    async function make() {

        main.querySelectorAll("[data-fill]").forEach(function (b) { b.classList.toggle("on", b.dataset.fill === col); });
        main.querySelectorAll("[data-line]").forEach(function (b) { b.classList.toggle("on", b.dataset.line === L.line); });
      }
      function select(L) { T.sel = L; sync(); draw(); }
      // 되돌리기·다시 하기: 한 번 바꿀 때마다 모습을 적어 둠 (60번까지)
      var copyL = function (L) { return Object.assign({}, L); };
      function hbtn() { if ($("th-undo")) { $("th-undo").disabled = H.i <= 0; $("th-redo").disabled = H.i >= H.list.length - 1; } }
      function mark() {
        var s = { layers: T.layers.map(copyL), bg: T.bg ? Object.assign({}, T.bg) : null, sel: T.layers.indexOf(T.sel) };
        s.k = JSON.stringify([s.layers, s.bg ? [s.bg.id, s.bg.zoom, s.bg.ox, s.bg.oy, s.bg.dim] : 0]);
        if (H.i >= 0 && H.list[H.i].k === s.k) return;
        H.list = H.list.slice(0, H.i + 1); H.list.push(s);
        if (H.list.length > 60) H.list.shift();
        H.i = H.list.length - 1; hbtn();
      }
      function step(dir) {
        var s = H.list[H.i + dir]; if (!s) return;
        H.i += dir;
        T.layers = s.layers.map(copyL); T.bg = s.bg ? Object.assign({}, s.bg) : null; T.sel = T.layers[s.sel] || null;
        T.layers.forEach(font); sync(); draw(); hbtn();
      }
      var markT = 0;
      function markSoon() { clearTimeout(markT); markT = setTimeout(mark, 600); }
      function addText(t) {
        var L = { type: "text", text: tLines(t || tShort(d) || "글자를 써 주세요"), font: "jua", fill: "#ffffff", line: "#3b1d0e", fs: 150, x: TSZ / 2, y: TSZ * 0.74, rot: 0 };
        tFit(ctx, L, TSZ - 90); T.layers.push(L); font(L); select(L); mark();
      }
      // 사진 줄
      function strip() {
        var el = $("th-strip"); if (!el) return;
        var cells = extra.map(function (x, i) { return '<button type="button" class="th-ph" data-x="' + i + '"><img alt="고른 사진" src="' + x.url + '"></button>'; });
        have.slice(0, shown).forEach(function (n) { cells.push('<button type="button" class="th-ph" data-n="' + n + '"><img alt="사진 ' + n + '" id="th-p' + n + '"' + (pv[n] ? ' src="' + pv[n] + '"' : "") + '><i>' + n + "</i></button>"); });
        if (shown < have.length) cells.push('<button type="button" class="th-ph more" id="th-more">사진 더 보기</button>');
        cells.push('<label class="th-ph more"><input type="file" id="th-file" accept="image/*">📁 다른 사진</label>');
        el.innerHTML = cells.join("");
        $("th-file").addEventListener("change", function (e) {
          var f = e.target.files && e.target.files[0]; if (!f) return;
          prep(f).then(function (it) { extra.unshift(it); strip(); setBg(function () { return tImg("data:image/jpeg;base64," + it.b64); }); }, function () { msg(tm, "이 사진은 열 수 없어요. 다른 사진을 골라 주세요.", true); });
        });
        if ($("th-more")) $("th-more").addEventListener("click", more);
      }
      var pv = {}, pb = {}; // 미리 보기 주소, 서버에서 받은 사진 글자
      async function more() {
        var from = shown; shown = Math.min(have.length, shown + STEP); strip();
        for (var i = from; i < shown; i++) {
          var n = have[i];
          if (pv[n]) continue;
          if (mine && mine.prev[n - 1]) pv[n] = mine.prev[n - 1];
          else { var b = await photoText(d.id, n); if (!b) continue; pb[n] = b; pv[n] = "data:" + tMime(b) + ";base64," + b; }
          var im = $("th-p" + n); if (im) im.src = pv[n]; else if ($("th-cv") !== cv) return;
          if (!T.bg && i === 0) pickN(n);
        }
      }
      function srcOf(n) { return mine && mine.b64s[n - 1] ? tImg("data:image/jpeg;base64," + mine.b64s[n - 1]) : pv[n] ? tImg(pv[n]) : Promise.reject(new Error("사진이 아직 안 왔어요")); }
      function pickN(n) { return setBg(function () { return srcOf(n); }); }
      async function setBg(get) {
        msg(tm, "배경 사진을 불러오는 중…");
        try {
          var src = await get(), c = tCanvasOf(src); if (src.close) src.close();
          T.bg = { c: c, id: ++thKeep.seq, zoom: 1, ox: 0, oy: 0, dim: T.bg ? T.bg.dim : 0.12 };
          msg(tm, ""); sync(); draw(); mark();
        } catch (e) { msg(tm, "사진을 못 불러왔어요: " + String((e && e.message) || e), true); }
      }
      $("th-strip").addEventListener("click", function (e) {
        var b = e.target.closest("button.th-ph"); if (!b) return;
        if (b.dataset.n) pickN(+b.dataset.n);
        else if (b.dataset.x) { var x = extra[+b.dataset.x]; if (x) setBg(function () { return tImg("data:image/jpeg;base64," + x.b64); }); }
      });
      // 손가락
      var pts = {}, grab = null;
      function pos(e) { var r = cv.getBoundingClientRect(), k = TSZ / r.width; return { x: (e.clientX - r.left) * k, y: (e.clientY - r.top) * k }; }
      function hit(p) {
        for (var i = T.layers.length - 1; i >= 0; i--) {
          var L = T.layers[i], z = tSize(ctx, L), a = -(L.rot || 0) * Math.PI / 180, dx = p.x - L.x, dy = p.y - L.y;
          var lx = dx * Math.cos(a) - dy * Math.sin(a), ly = dx * Math.sin(a) + dy * Math.cos(a);
          if (Math.abs(lx) <= z.w / 2 + 24 && Math.abs(ly) <= z.h / 2 + 24) return L;
        }
        return null;
      }
      function two() { var k = Object.keys(pts); if (k.length < 2) return 0; var a = pts[k[0]], b = pts[k[1]]; return Math.hypot(a.x - b.x, a.y - b.y); }
      cv.addEventListener("pointerdown", function (e) {
        e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) {}
        var p = pos(e); pts[e.pointerId] = p;
        if (Object.keys(pts).length === 1) {
          var L = hit(p);
          if (L !== T.sel) select(L);
          grab = L ? { L: L, dx: p.x - L.x, dy: p.y - L.y } : T.bg ? { bg: true, sx: p.x, sy: p.y, ox: T.bg.ox, oy: T.bg.oy } : null;
        } else {
          var t = T.sel;
          grab = { pinch: two(), base: t ? (t.type === "text" ? t.fs : t.s) : T.bg ? T.bg.zoom : 1, L: t };
        }
      });
      cv.addEventListener("pointermove", function (e) {
        if (!pts[e.pointerId] || !grab) return;
        var p = pos(e); pts[e.pointerId] = p;
        if (grab.pinch) {
          var k = two() / grab.pinch, L = grab.L; if (!isFinite(k) || k <= 0) return;
          if (L && L.type === "text") L.fs = Math.max(40, Math.min(320, grab.base * k));
          else if (L) L.s = Math.max(60, Math.min(700, grab.base * k));
          else if (T.bg) T.bg.zoom = Math.max(1, Math.min(3, grab.base * k));
          sync();
        } else if (grab.L) { grab.L.x = Math.max(0, Math.min(TSZ, p.x - grab.dx)); grab.L.y = Math.max(0, Math.min(TSZ, p.y - grab.dy)); }
        else if (grab.bg) { T.bg.ox = grab.ox + p.x - grab.sx; T.bg.oy = grab.oy + p.y - grab.sy; }
        draw();
      });
      var up = function (e) { delete pts[e.pointerId]; grab = null; mark(); };
      cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
      // 조절
      $("th-zoom").addEventListener("input", function (e) { if (T.bg) { T.bg.zoom = +e.target.value; draw(); } });
      $("th-dim").addEventListener("input", function (e) { if (T.bg) { T.bg.dim = +e.target.value; draw(); } });
      $("th-size").addEventListener("input", function (e) { var L = T.sel; if (!L) return; if (L.type === "text") L.fs = +e.target.value; else L.s = +e.target.value; draw(); });
      $("th-rot").addEventListener("input", function (e) { if (T.sel) { T.sel.rot = +e.target.value; draw(); } });
      $("th-text").addEventListener("input", function (e) { var L = T.sel; if (L && L.type === "text") { L.text = e.target.value; font(L); draw(); } });
      main.querySelectorAll("[data-font]").forEach(function (b) { b.addEventListener("click", function () { var L = T.sel; if (L && L.type === "text") { L.font = b.dataset.font; font(L); sync(); draw(); mark(); } }); });
      $("th-rm").addEventListener("click", function () { T.layers = T.layers.filter(function (x) { return x !== T.sel; }); select(null); mark(); });
      ["th-zoom", "th-dim", "th-size", "th-rot", "th-text"].forEach(function (id) { $(id).addEventListener("change", mark); });
      $("th-text").addEventListener("input", markSoon);
      $("th-undo").addEventListener("click", function () { clearTimeout(markT); mark(); step(-1); });
      $("th-redo").addEventListener("click", function () { step(1); });
      main.querySelectorAll("[data-fill]").forEach(function (b) { b.addEventListener("click", function () { var L = T.sel; if (!L) return; if (L.type === "text") L.fill = b.dataset.fill; else L.color = b.dataset.fill; sync(); draw(); mark(); }); });
      main.querySelectorAll("[data-line]").forEach(function (b) { b.addEventListener("click", function () { if (T.sel && T.sel.type === "text") { T.sel.line = b.dataset.line; sync(); draw(); mark(); } }); });
      main.querySelectorAll("[data-tt]").forEach(function (b) { b.addEventListener("click", function () { var L = T.sel; if (L && L.type === "text") { L.text = tLines(b.dataset.tt); tFit(ctx, L, TSZ - 90); font(L); sync(); draw(); mark(); } }); });
      main.querySelectorAll("[data-add]").forEach(function (b) { b.addEventListener("click", function () {
        var k = b.dataset.add;
        if (k === "text") return addText(T.layers.some(function (x) { return x.type === "text"; }) ? "글자" : "");
        var L = { type: "deco", kind: k, color: k === "heart" ? "#ff3b30" : "#ffd60a", s: k === "spark" ? 260 : 170, x: TSZ * 0.5, y: TSZ * 0.3, rot: 0 };
        T.layers.push(L); select(L); mark();
      }); });
      function back(note) { showDraft(cur, miss); if (note) msg($("dmsg"), note); }
      $("th-back").addEventListener("click", function () { back(); });
      function flat() {
        var c = document.createElement("canvas"); c.width = c.height = TSZ; tRender(c.getContext("2d"), T, null);
        var q = 0.9, b = c.toDataURL("image/jpeg", q).split(",")[1] || "";
        while (b.length > MAXB64 && q > 0.5) { q -= 0.1; b = c.toDataURL("image/jpeg", q).split(",")[1] || ""; }
        return b;
      }
      $("th-save").addEventListener("click", async function () {
        if (!T.bg && !T.layers.length) return msg(tm, "배경 사진을 고르거나 글자를 넣어 주세요.", true);
        var bt = $("th-save"); bt.disabled = true; msg(tm, "썸네일을 저장하는 중…");
        var r = await api("/draft/photo?d=" + encodeURIComponent(d.id) + "&n=0", null, flat());
        if (r && r.ok) { cur.thumb = true; back("썸네일을 저장했어요. PC에서 불러오면 글 맨 앞에 들어가요."); }
        else { bt.disabled = false; msg(tm, (r && r.error) || "저장하지 못했어요. 다시 눌러 주세요.", true); }
      });
      $("th-dl").addEventListener("click", function () {
        if (!T.bg && !T.layers.length) return msg(tm, "배경 사진을 고르거나 글자를 넣어 주세요.", true);
        var a = document.createElement("a"); a.href = "data:image/jpeg;base64," + flat(); a.download = "썸네일-" + new Date().toISOString().slice(0, 10) + ".jpg";
        document.body.appendChild(a); a.click(); a.remove();
        msg(tm, "사진으로 내려받았어요. 안 보이면 위 미리 보기를 길게 눌러 저장해 주세요.");
      });
      // 시작
      if (!document.getElementById("th-fonts")) { var lk = document.createElement("link"); lk.id = "th-fonts"; lk.rel = "stylesheet"; lk.href = "https://fonts.googleapis.com/css2?" + Object.keys(TFONT).filter(function (k) { return TFONT[k][0]; }).map(function (k) { return "family=" + TFONT[k][0].replace(/ /g, "+") + (TFONT[k][3] || ""); }).join("&") + "&display=swap"; document.head.appendChild(lk); }
      T.layers.forEach(font);
      if (!T.layers.length && H.i < 0) addText(""); else { sync(); draw(); }
      hbtn();
      if (!have.length) msg(tm, "이 초안의 사진이 서버에 없어요. ‘📁 다른 사진’으로 갤러리에서 골라 주세요.");
      strip(); more();
    }
    // 초안 화면의 썸네일 칸
    function thumbCard(d) {
      return '<div class="cm-card pd-card"><h2 class="cm-h3">🖼 썸네일</h2><div id="th-now"></div>' +
        '<div class="pd-acts"><button class="cm-btn" type="button" id="th-open">' + (d.thumb ? "썸네일 다시 만들기" : "썸네일 만들기") + "</button>" + (d.thumb ? '<button class="pd-quiet" type="button" id="th-del">썸네일 지우기</button>' : "") + "</div>" +
        '<p class="cm-cap">' + (d.thumb ? "PC에서 이 초안을 불러오면 글 맨 앞에 같이 들어가요." : "사진 한 장에 제목 글자를 올려 정사각형 썸네일을 만들어요. PC에서 불러올 때 글 맨 앞에 같이 들어가요.") + "</p></div>";
    }
    function bindThumb(d, miss) {
      $("th-open").addEventListener("click", function () {
        cur.title = $("d-title").value; cur.body = $("d-body").value; cur.tags = $("d-tags").value; // 고치던 글이 화면에서 사라지지 않게
        thumbEditor(cur, miss);
      });
      if ($("th-del")) $("th-del").addEventListener("click", function () {
        api("/draft/photo?d=" + encodeURIComponent(d.id) + "&n=0", null, "del").then(function (j) { if (j.ok) { cur.thumb = false; cur.title = $("d-title").value; cur.body = $("d-body").value; cur.tags = $("d-tags").value; showDraft(cur, miss); } });
      });
      if (d.thumb) photoText(d.id, 0).then(function (b) { var el = $("th-now"); if (el && b && cur && cur.id === d.id) el.innerHTML = '<img class="th-now" alt="저장한 썸네일" src="data:' + tMime(b) + ";base64," + b + '">'; });
    }

    function copy(t) {
      if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).then(function () { return true; }, function () { return false; });
      return Promise.resolve(false);
    }

    // ---------- PC 연결 키 ----------
    function keyCard() {
      var k = L.pcKey;
      return '<div class="cm-card pd-card"><h2 class="cm-h3">PC 연결 키</h2>' +
        '<p class="cm-cap">PC 확장 프로그램이 내 초안을 읽을 때 쓰는 열쇠예요. 확장 프로그램의 “📱 폰 초안” 칸에 한 번만 넣으면 돼요. 이 키로는 초안을 읽기만 할 수 있어요.</p>' +
        (k ? '<p class="cm-cap">' + when(k.made) + "에 만든 키가 있어요" + (k.used ? " · 마지막 사용 " + when(k.used) : " · 아직 쓴 적 없음") + ".</p>" : "") +
        '<div id="kbox"></div><div class="pd-acts"><button class="cm-btn" type="button" id="k-new">' + (k ? "새 키 만들기 (옛 키는 못 쓰게 돼요)" : "PC 연결 키 만들기") + "</button>" + (k ? '<button class="pd-quiet" type="button" id="k-off">키 없애기</button>' : "") + "</div></div>";
    }
    function bindKey() {
      $("k-new").addEventListener("click", function () {
        api("/draft/key", { act: "new" }).then(function (j) {
          if (!j.ok) { msg($("kbox"), j.error || "만들지 못했어요.", true); return; }
          $("kbox").innerHTML = '<div class="pd-key"><code id="kval">' + esc(j.key) + '</code><button class="cm-btn pri" type="button" id="k-copy">복사</button></div><p class="cm-cap">이 키는 지금 한 번만 보여 드려요. 복사해서 PC로 보내(카톡 나에게 보내기 등) 확장 프로그램에 붙여 넣어 주세요.</p>';
          $("k-copy").addEventListener("click", function () { copy(j.key).then(function (ok) { $("k-copy").textContent = ok ? "복사했어요" : "길게 눌러 복사해 주세요"; }); });
        });
      });
      if ($("k-off")) $("k-off").addEventListener("click", function () { api("/draft/key", { act: "off" }).then(home); });
    }

    window.addEventListener("beforeunload", function (e) { if (busyNow) { e.preventDefault(); e.returnValue = ""; } });
    home();
  })();
  // ☰ 메뉴 열고 닫기 (바깥 누르기·Esc·메뉴 고르기로 닫힘)
  (function () {
    var b = document.getElementById("mbtn"), n = document.getElementById("mnav");
    if (!b || !n) return;
    function set(open) { n.hidden = !open; b.setAttribute("aria-expanded", open ? "true" : "false"); b.setAttribute("aria-label", open ? "메뉴 닫기" : "메뉴 열기"); }
    b.addEventListener("click", function (e) { e.stopPropagation(); set(n.hidden); });
    n.addEventListener("click", function () { set(false); });
    document.addEventListener("click", function (e) { if (!n.hidden && !n.contains(e.target)) set(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !n.hidden) { set(false); b.focus(); } });
  })();
</script>
